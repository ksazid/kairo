name: VS-73 live Instagram production smoke
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnose configured Instagram OAuth redirect
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
          KAIRO_SMOKE_TOKEN: ${{ secrets.KAIRO_SMOKE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.KAIRO_API_URL.replace(/\/$/,"");
          const auth={authorization:`Bearer ${process.env.KAIRO_SMOKE_TOKEN}`};
          const sessionResponse=await fetch(`${base}/api/v1/session`,{headers:auth});
          const session=await sessionResponse.json();
          if(!sessionResponse.ok||!session?.workspaces?.[0]?.id)throw new Error("session unavailable");
          const workspaceId=session.workspaces[0].id;
          const brandsResponse=await fetch(`${base}/api/v1/workspaces/${encodeURIComponent(workspaceId)}/brands`,{headers:auth});
          const brands=await brandsResponse.json();
          if(!brandsResponse.ok||!Array.isArray(brands)||!brands.length)throw new Error("brands unavailable");
          let diagnostic=null;
          for(const brand of brands){
            const response=await fetch(`${base}/api/v1/brands/${encodeURIComponent(brand.id)}/channels/instagram/connect`,{method:"POST",headers:auth});
            if(!response.ok)continue;
            const payload=await response.json();
            if(!payload?.authorizationUrl)continue;
            const authorizationUrl=new URL(payload.authorizationUrl);
            const redirect=authorizationUrl.searchParams.get("redirect_uri");
            if(!redirect)throw new Error("authorization URL has no redirect_uri");
            const redirectUrl=new URL(redirect);
            diagnostic={
              brandId:brand.id,
              appId:authorizationUrl.searchParams.get("client_id"),
              scopes:(authorizationUrl.searchParams.get("scope")??"").split(",").filter(Boolean),
              responseType:authorizationUrl.searchParams.get("response_type"),
              redirectOrigin:redirectUrl.origin,
              redirectPath:redirectUrl.pathname,
            };
            break;
          }
          if(!diagnostic)throw new Error("no Instagram connect intent could be created");
          console.log(`INSTAGRAM_OAUTH_DIAGNOSTIC=${JSON.stringify(diagnostic)}`);
          NODE
      - name: Prepare truth-safe Campaign from existing Research only
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
          KAIRO_SMOKE_TOKEN: ${{ secrets.KAIRO_SMOKE_TOKEN }}
          KAIRO_RELEASE_SHA: 05f7442014f6deb0d8d53f434b3dd99cb554b4a6
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.KAIRO_API_URL.replace(/\/$/,"");
          const auth={authorization:`Bearer ${process.env.KAIRO_SMOKE_TOKEN}`,"content-type":"application/json"};
          const session=await (await fetch(`${base}/api/v1/session`,{headers:auth})).json();
          const workspaceId=session?.workspaces?.[0]?.id;
          if(!workspaceId)throw new Error("session unavailable");
          const brands=await (await fetch(`${base}/api/v1/workspaces/${encodeURIComponent(workspaceId)}/brands`,{headers:auth})).json();
          let target=null;
          for(const brand of brands){
            const accounts=await (await fetch(`${base}/api/v1/brands/${encodeURIComponent(brand.id)}/channel-accounts`,{headers:auth})).json();
            const account=Array.isArray(accounts)?accounts.find(a=>a?.channel==="instagram"&&a?.status==="connected"&&Array.isArray(a?.capabilities)&&a.capabilities.includes("publish-image")):null;
            if(account){target={brand,account};break;}
          }
          if(!target)throw new Error("No connected Instagram target");
          const brandId=encodeURIComponent(target.brand.id);
          const ideas=await (await fetch(`${base}/api/v1/brands/${brandId}/ideas`,{headers:auth})).json();
          if(!Array.isArray(ideas))throw new Error("Ideas unavailable");
          let candidate=null;
          let chosenAngle=null;
          for(const idea of ideas){
            const response=await fetch(`${base}/api/v1/brands/${brandId}/ideas/${encodeURIComponent(idea.id)}`,{headers:auth});
            if(!response.ok)continue;
            const bundle=await response.json();
            if(!bundle?.research||!Array.isArray(bundle?.angles)||!bundle.angles.length)continue;
            const claims=new Map((bundle.research.claims??[]).map(c=>[c.id,c]));
            const safe=bundle.angles.find(angle=>Array.isArray(angle?.supportingClaimIds)&&angle.supportingClaimIds.length>0&&angle.supportingClaimIds.every(id=>{
              const claim=claims.get(id);
              if(!claim)return false;
              if(claim.classification==="fact"&&(claim.verificationState!=="supported"||claim.freshness!=="fresh"))return false;
              const authz=claim.firstPersonAuthorization;
              if(authz!=="not-applicable"&&authz!=="authorized")return false;
              return true;
            }));
            if(safe){candidate=bundle;chosenAngle=safe;break;}
          }
          if(!candidate||!chosenAngle)throw new Error("No existing truth-safe Angle exists for this Instagram Brand; publish-first smoke will not create or refresh Research");
          let selected=candidate.angles.find(a=>a?.status==="selected"&&a.id===chosenAngle.id);
          if(!selected){
            const selection=await fetch(`${base}/api/v1/brands/${brandId}/ideas/${encodeURIComponent(candidate.idea.id)}/angles/${encodeURIComponent(chosenAngle.id)}/select`,{method:"POST",headers:auth,body:JSON.stringify({expectedVersion:chosenAngle.version})});
            if(!selection.ok)throw new Error(`Truth-safe Angle selection failed: ${selection.status}`);
            const angles=await selection.json();
            selected=Array.isArray(angles)?angles.find(a=>a?.status==="selected"&&a.id===chosenAngle.id):null;
          }
          if(!selected)throw new Error("Truth-safe Angle selection did not persist");
          const created=await fetch(`${base}/api/v1/brands/${brandId}/campaigns`,{method:"POST",headers:auth,body:JSON.stringify({ideaId:candidate.idea.id,name:`VS-73 Instagram Truth-Safe Publish ${Date.now()}`,objective:"Provider-confirmed production Instagram publishing verification"})});
          const body=await created.json().catch(()=>null);
          if(created.status!==201||!body?.id)throw new Error(`Truth-safe Campaign creation failed: ${created.status} ${JSON.stringify(body)}`);
          console.log(`PUBLISH_CAMPAIGN=CREATED_TRUTH_SAFE:${body.id}:${chosenAngle.id}`);
          NODE
      - name: Run provider-confirmed Instagram production smoke
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
          KAIRO_RELEASE_SHA: 05f7442014f6deb0d8d53f434b3dd99cb554b4a6
          KAIRO_SMOKE_TOKEN: ${{ secrets.KAIRO_SMOKE_TOKEN }}
          KAIRO_INSTAGRAM_SMOKE_IMAGE_URL: https://dummyimage.com/1080x1080/111827/ffffff.png&text=Kairo+VS-73+Live+Publish
        run: node scripts/prod-smoke-readonly.mjs
