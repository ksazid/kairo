name: VS-73 final production smoke
on:
  push:
    branches:
      - smoke/vs72-multi-brand
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run final authenticated production smoke
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
          KAIRO_RELEASE_SHA: 7f60ec25f26205fdf863cee34f6c5987b2ecdc25
          KAIRO_SMOKE_TOKEN: ${{ secrets.KAIRO_SMOKE_TOKEN }}
        run: node scripts/prod-smoke-readonly.mjs
