name: VS-94 Calendar and Insights fidelity evidence

on:
  push:
    branches:
      - fix/calendar-insights-approved-pixel-fidelity-2026-08-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web
        run: npm run build --workspace @kairo/web
      - name: Start controlled Calendar and Insights fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vs94-calendar-insights
          node scripts/vs94-calendar-insights-mock-api.mjs >/tmp/vs94-api.log 2>&1 &
          KAIRO_API_URL=http://127.0.0.1:4000 npm run start --workspace @kairo/web -- -p 3000 >/tmp/vs94-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vs94-api.log || true
          cat /tmp/vs94-web.log || true
          exit 1
      - name: Capture approved Calendar and Insights surfaces
        run: node scripts/vs94-calendar-insights-capture.mjs artifacts/vs94-calendar-insights
      - name: Validate fixed geometry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('artifacts/vs94-calendar-insights/dom-evidence.json','utf8'));
          const calendar = evidence.captures.find(c => c.name === 'calendar-728x1536')?.dom;
          const insights = evidence.captures.find(c => c.name === 'insights-728x1536')?.dom;
          const mobileCalendar = evidence.captures.find(c => c.name === 'calendar-mobile-390x844')?.dom;
          const mobileInsights = evidence.captures.find(c => c.name === 'insights-mobile-390x844')?.dom;
          if (!calendar || !insights || !mobileCalendar || !mobileInsights) throw new Error('Missing VS-94 evidence capture');
          const near = (value,target,tolerance,label) => { if (value == null || Math.abs(value-target) > tolerance) throw new Error(`${label}: ${value} not within ${tolerance}px of ${target}`); };
          for (const [label,dom] of [['calendar',calendar],['insights',insights],['mobile-calendar',mobileCalendar],['mobile-insights',mobileInsights]]) {
            if (dom.scrollWidth > dom.clientWidth) throw new Error(`${label}: horizontal overflow ${dom.scrollWidth}>${dom.clientWidth}`);
            if (dom.navItems?.length !== 5) throw new Error(`${label}: expected five bottom navigation items`);
          }

          // Browser evidence intentionally excludes the native iOS status bar shown in the bitmap authority.
          near(calendar.header?.height,56,2,'Calendar app header');
          near(calendar.bottomNav?.height,86,4,'Calendar bottom nav');
          near(calendar.viewTabs?.height,54,4,'Calendar view tabs');
          if (calendar.cards.length !== 6) throw new Error(`Calendar expected 6 fixture cards, got ${calendar.cards.length}`);
          for (const [i,card] of calendar.cards.entries()) near(card.height,130,10,`Calendar card ${i+1}`);
          for (const [i,thumbnail] of calendar.thumbnails.entries()) { near(thumbnail.width,124,4,`Calendar thumbnail ${i+1} width`); near(thumbnail.height,100,4,`Calendar thumbnail ${i+1} height`); }
          for (const href of calendar.cardHrefs) {
            if (!/^\/brands\/brand-ui\/content\/campaign-[^/]+\/asset-[^/]+$/.test(href ?? '')) throw new Error(`Calendar card does not link to Content Preview: ${href}`);
          }
          if (!calendar.text.includes('Thursday, Apr 27') || !calendar.text.includes('Wednesday, Apr 26') || !calendar.text.includes('Tuesday, Apr 25')) throw new Error('Calendar grouped agenda drift');
          if (!calendar.text.includes('Scheduled') || !calendar.text.includes('Published') || !calendar.text.includes('Needs attention')) throw new Error('Calendar statuses missing');

          near(insights.header?.height,56,2,'Insights app header');
          near(insights.bottomNav?.height,86,4,'Insights bottom nav');
          near(insights.period?.height,52,4,'Insights period control');
          if (insights.metricCards.length !== 4) throw new Error(`Insights expected exactly 4 KPI cards, got ${insights.metricCards.length}`);
          for (const [i,card] of insights.metricCards.entries()) near(card.height,184,12,`Insights metric ${i+1}`);
          near(insights.chart?.height,235,12,'Insights engagement chart');
          if (insights.patternCards.length !== 2) throw new Error(`Insights expected 2 why cards, got ${insights.patternCards.length}`);
          if (!insights.nextCard) throw new Error('Insights next-action card missing');
          if (!insights.text.includes('What happened') || !insights.text.includes('Why it happened') || !insights.text.includes('What to do next')) throw new Error('Insights hierarchy drift');
          if (!insights.text.includes('12.4K') || !insights.text.includes('1.2K') || !insights.text.includes('320') || !insights.text.includes('6.7%')) throw new Error('Insights approved KPI evidence drift');
          if (!insights.text.includes('18%') || !insights.text.includes('27%') || !insights.text.includes('15%') || !insights.text.includes('9%')) throw new Error('Insights comparison evidence drift');
          if (insights.text.includes('Trend unavailable')) throw new Error('Insights visual fixture must exercise real trend rendering');
          if (insights.text.includes('Candidate Learnings') || insights.text.includes('Decision brief') || insights.text.includes('Evidence IDs')) throw new Error('Technical Insights machinery leaked');
          NODE
      - name: Include logs
        if: always()
        run: |
          cp /tmp/vs94-api.log artifacts/vs94-calendar-insights/api.log 2>/dev/null || true
          cp /tmp/vs94-web.log artifacts/vs94-calendar-insights/web.log 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs94-calendar-insights-fidelity-evidence
          path: artifacts/vs94-calendar-insights
          if-no-files-found: error
          retention-days: 90
