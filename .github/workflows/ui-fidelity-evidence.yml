name: VS-92 Home pixel fidelity evidence

on:
  push:
    branches:
      - fix/home-approved-pixel-fidelity-2026-08-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web
        run: npm run build --workspace @kairo/web
      - name: Start controlled Home fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/vs92-home
          node scripts/vs92-home-mock-api.mjs >/tmp/vs92-api.log 2>&1 &
          KAIRO_API_URL=http://127.0.0.1:4000 npm run start --workspace @kairo/web -- -p 3000 >/tmp/vs92-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vs92-api.log || true
          cat /tmp/vs92-web.log || true
          exit 1
      - name: Capture Home at approved viewport
        run: node scripts/vs92-home-capture.mjs artifacts/vs92-home
      - name: Validate fixed geometry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const e=JSON.parse(readFileSync('artifacts/vs92-home/dom-evidence.json','utf8'));
          const m=e.captures.find(c=>c.name==='home-mobile-393x852')?.dom;
          if(!m) throw new Error('missing 393x852 evidence');
          const near=(value,target,tolerance,label)=>{if(Math.abs(value-target)>tolerance)throw new Error(`${label}: ${value} not within ${tolerance}px of ${target}`)};
          if(m.scrollWidth>m.clientWidth) throw new Error(`horizontal overflow ${m.scrollWidth}>${m.clientWidth}`);
          near(m.mobileHeader.height,56,2,'mobile header height');
          near(m.attention.height,85,8,'attention card height');
          if(m.toolCells.length!==4) throw new Error('expected four source controls');
          for(const [i,cell] of m.toolCells.entries()){near(cell.height,38,1,`tool ${i} height`);near(cell.width,91,3,`tool ${i} width`);}
          if(m.metrics.length!==4) throw new Error('expected four KPI cards');
          for(const [i,card] of m.metrics.entries()){near(card.height,78,1,`metric ${i} height`);near(card.width,86,3,`metric ${i} width`);}
          if(!m.homeText.includes('Publishing needs attention')) throw new Error('attention copy drift');
          if(!m.homeText.includes('Share your thought and let Kairo recommend the best format.')) throw new Error('My idea copy drift');
          if(!m.homeText.includes('Smart recommendations based on your brand and goals.')) throw new Error('For you copy drift');
          if(!m.homeText.includes("A quick pulse of your content performance.")) throw new Error('performance copy drift');
          NODE
      - name: Include logs
        if: always()
        run: |
          cp /tmp/vs92-api.log artifacts/vs92-home/api.log 2>/dev/null || true
          cp /tmp/vs92-web.log artifacts/vs92-home/web.log 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs92-home-pixel-evidence
          path: artifacts/vs92-home
          if-no-files-found: error
          retention-days: 90
