name: VS-91 UI fidelity evidence

on:
  push:
    branches:
      - ui/approved-fidelity-implementation-2026-08-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build --workspace @kairo/web

      - name: Start controlled UI fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-fidelity
          node scripts/ui-fidelity-mock-api.mjs >/tmp/kairo-ui-mock.log 2>&1 &
          echo $! >/tmp/kairo-ui-mock.pid
          KAIRO_API_URL=http://127.0.0.1:4000 npm run start --workspace @kairo/web -- -p 3000 >/tmp/kairo-ui-web.log 2>&1 &
          echo $! >/tmp/kairo-ui-web.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Mock API log:'
          cat /tmp/kairo-ui-mock.log || true
          echo 'Web log:'
          cat /tmp/kairo-ui-web.log || true
          exit 1

      - name: Capture actual Home desktop and mobile
        run: node scripts/ui-fidelity-capture.mjs artifacts/ui-fidelity

      - name: Validate rendered contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('artifacts/ui-fidelity/dom-evidence.json', 'utf8'));
          for (const capture of evidence.captures) {
            if (capture.dom.title !== 'Home') throw new Error(`${capture.name}: expected Home title`);
            const expected = ['Home', 'Content', 'Calendar', 'Insights', 'Brand'];
            if (JSON.stringify(capture.dom.desktopNav) !== JSON.stringify(expected)) throw new Error(`${capture.name}: desktop nav drift`);
            if (JSON.stringify(capture.dom.mobileNav) !== JSON.stringify(expected)) throw new Error(`${capture.name}: mobile nav drift`);
            if (capture.dom.sections.length !== 4) throw new Error(`${capture.name}: expected four frozen Home sections, found ${capture.dom.sections.length}`);
          }
          NODE

      - name: Crop frozen Home reference from approval board
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('product/approved-ui/kairo-approved-ui-pages-board-2026-08-25.webp')
          out = Path('artifacts/ui-fidelity/approved-home-reference.png')
          image = Image.open(source).convert('RGB')
          w, h = image.size
          # The frozen board contains 12 ordered desktop references in a 3-column x 4-row contact sheet.
          cell_w, cell_h = w // 3, h // 4
          image.crop((0, 0, cell_w, cell_h)).save(out)
          Path('artifacts/ui-fidelity/reference-metadata.txt').write_text(f'board={w}x{h}\nhome-cell={cell_w}x{cell_h}\n')
          PY

      - name: Include server logs
        if: always()
        shell: bash
        run: |
          cp /tmp/kairo-ui-mock.log artifacts/ui-fidelity/mock-api.log 2>/dev/null || true
          cp /tmp/kairo-ui-web.log artifacts/ui-fidelity/web.log 2>/dev/null || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs91-ui-fidelity-evidence
          path: artifacts/ui-fidelity
          if-no-files-found: error
          retention-days: 90
