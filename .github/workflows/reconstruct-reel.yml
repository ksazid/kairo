name: VS-82 verified Reel media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-media:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable public Reel
        env:
          REEL_URL: https://raw.githubusercontent.com/ksazid/kairo/0fabdf638441c89248c81c7c81eb35966fd4bc73/smoke-assets/ktm390duke-official-spec-reel.mp4
        run: |
          curl --fail --location --silent --show-error "$REEL_URL" --output /tmp/reel.mp4
          test "$(stat -c %s /tmp/reel.mp4)" = "46698"
          echo "deb9f1657212ea22228917ae7261702708f441d8e759335628c4da3d26faeee8  /tmp/reel.mp4" | sha256sum -c -
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size -of json /tmp/reel.mp4
