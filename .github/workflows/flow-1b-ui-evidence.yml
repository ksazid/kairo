name: Flow 1B Brand Brain UI evidence

on:
  push:
    branches:
      - feat/flow-1b-brand-brain-activation
    paths:
      - "apps/kairo-ui-v2/app/brain/**"
      - "apps/kairo-ui-v2/app/kairo-shell.tsx"
      - "apps/kairo-ui-v2/lib/brand-brain-*.ts"
      - "packages/domain/src/brand-brain-activation*"
      - "apps/api/src/brand-dna-readiness-routes*"
      - "scripts/flow-1b-brain-*.mjs"
      - ".github/workflows/flow-1b-ui-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Kairo v2
        run: npm run build --workspace @kairo/ui-v2
      - name: Start controlled Flow 1B fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/flow-1b-brain
          node scripts/flow-1b-brain-mock-api.mjs >/tmp/flow-1b-api.log 2>&1 &
          KAIRO_API_URL=http://127.0.0.1:4000 npm run start --workspace @kairo/ui-v2 -- -p 3000 >/tmp/flow-1b-ui.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/brain >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/flow-1b-api.log || true
          cat /tmp/flow-1b-ui.log || true
          exit 1
      - name: Capture Brand Brain surfaces
        run: node scripts/flow-1b-brain-capture.mjs artifacts/flow-1b-brain
      - name: Validate Kairo v2 Brand Brain contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('artifacts/flow-1b-brain/dom-evidence.json','utf8'));
          const desktop = evidence.captures.find(c => c.name === 'brain-desktop-1440x1200')?.dom;
          const editor = evidence.captures.find(c => c.name === 'brain-editor-1440x1200')?.dom;
          const mobile = evidence.captures.find(c => c.name === 'brain-mobile-390x844')?.dom;
          if (!desktop || !editor || !mobile) throw new Error('Missing Flow 1B visual evidence capture');
          for (const [label, dom] of [['desktop',desktop],['editor',editor],['mobile',mobile]]) {
            if (dom.scrollWidth > dom.clientWidth) throw new Error(`${label}: horizontal overflow ${dom.scrollWidth}>${dom.clientWidth}`);
            if (!dom.text.includes('Brand Brain')) throw new Error(`${label}: Brand Brain heading missing`);
            if (!dom.text.includes('Ready for Hunter')) throw new Error(`${label}: Hunter readiness status missing`);
            if (dom.text.includes('sourceIds') || dom.text.includes('fieldKey') || dom.text.includes('expectedVersion')) throw new Error(`${label}: technical implementation detail leaked into UI`);
          }
          if (desktop.brainSections.length !== 7) throw new Error(`desktop: expected 7 frozen Brand DNA sections, got ${desktop.brainSections.length}`);
          if (mobile.brainSections.length !== 7) throw new Error(`mobile: expected 7 frozen Brand DNA sections, got ${mobile.brainSections.length}`);
          if (desktop.metricCards.length !== 4) throw new Error(`desktop: expected 4 activation metrics, got ${desktop.metricCards.length}`);
          if (desktop.activeNav !== 'Brand') throw new Error(`desktop: Kairo v2 Brand nav not active: ${desktop.activeNav}`);
          if (desktop.navLabels.join('|') !== 'Home|Discover|Content|Campaigns|Calendar|Insights|Brand') throw new Error(`desktop: navigation drift ${desktop.navLabels.join('|')}`);
          for (const required of ['Brand Intelligence','Completeness','Evidence','Confirmed','Hunter readiness','Evidence sources','Source backed','User confirmed']) {
            if (!desktop.text.includes(required)) throw new Error(`desktop: missing ${required}`);
          }
          if (desktop.sourceLinkCount < 2) throw new Error(`desktop: expected evidence source links, got ${desktop.sourceLinkCount}`);
          if (!editor.dialog || !editor.dialogText.includes('Save & confirm') || !editor.dialogText.includes('user confirmed')) throw new Error('editor: inline confirmation contract missing');
          const near = (value,target,tolerance,label) => { if (value == null || Math.abs(value-target) > tolerance) throw new Error(`${label}: ${value} not within ${tolerance}px of ${target}`); };
          near(desktop.sidebar?.width,218,3,'desktop Kairo v2 sidebar width');
          near(desktop.topbar?.height,80,3,'desktop Kairo v2 topbar height');
          NODE
      - name: Include logs
        if: always()
        run: |
          cp /tmp/flow-1b-api.log artifacts/flow-1b-brain/api.log 2>/dev/null || true
          cp /tmp/flow-1b-ui.log artifacts/flow-1b-brain/ui.log 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-1b-brand-brain-ui-evidence
          path: artifacts/flow-1b-brain
          if-no-files-found: error
          retention-days: 90
