name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kairo_test
      NEON_AUTH_BASE_URL: https://auth.invalid
      NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-cookie-secret-32-characters-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: TEMP Neon Auth origin smoke
        env:
          AUTH_BASE: https://ep-twilight-dew-as4zvuvf.neonauth.c-4.eu-central-1.aws.neon.tech/kairo/auth
          APP_ORIGIN: https://kairo-git-fix-vercel-neon-auth-build-sazid62-gmailcoms-projects.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          const base = process.env.AUTH_BASE;
          const origin = process.env.APP_ORIGIN;
          const email = `kairo-auth-smoke-${process.env.GITHUB_RUN_ID}@example.com`;
          const password = `Aa1!${randomBytes(24).toString("base64url")}`;
          const response = await fetch(`${base}/sign-up/email`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "origin": origin,
            },
            body: JSON.stringify({ name: "Kairo Auth Smoke", email, password }),
          });
          const body = await response.text();
          console.log(`AUTH_SMOKE_STATUS=${response.status}`);
          if (!response.ok) {
            const safe = body.slice(0, 2000).replace(/[A-Za-z0-9_-]{24,}/g, "[redacted]");
            console.log(`AUTH_SMOKE_ERROR=${safe}`);
            process.exit(1);
          }
          console.log(`AUTH_SMOKE_EMAIL=${email}`);
          NODE
      - run: npm install --no-audit --no-fund
      - name: Verify certified migrations on clean PostgreSQL 18
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run preflight
      - run: npm run runtime:verify
      - run: npm run dashboard:build
      - uses: actions/upload-artifact@v4
        with:
          name: pes-dashboard
          path: dashboard/
          if-no-files-found: error

  semantic-benchmark:
    if: github.event_name == 'pull_request' && github.head_ref == 'kairo/vs-03'
    runs-on: ubuntu-latest
    services:
      semantic-postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_semantic
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
    env:
      SEMANTIC_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kairo_semantic
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-audit --no-fund
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run VS-03 semantic benchmark
        shell: bash
        run: |
          set -o pipefail
          node scripts/semantic-benchmark.mjs | tee semantic-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs03-semantic-benchmark
          path: semantic-benchmark.log
          if-no-files-found: error
