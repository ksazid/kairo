name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kairo_test
      NEON_AUTH_BASE_URL: https://auth.invalid
      NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-cookie-secret-32-characters-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --no-audit --no-fund
      - name: Generate fast-uri lockfile refresh
        run: npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          cp package-lock.json /tmp/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout "${{ github.head_ref }}"
          cp /tmp/package-lock.json package-lock.json
          git add package-lock.json
          git commit -m "chore(deps): refresh fast-uri lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Verify Hermes runtime contracts without provider credentials
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest==9.0.2
          python -m compileall -q services/hermes-runtime/hermes_runtime services/hermes-runtime/tests
          (cd services/hermes-runtime && python -m pytest -q)
      - name: Verify pinned Hermes package and zero-tool container profile
        run: |
          docker build -f services/hermes-runtime/Dockerfile -t kairo-hermes:ci .
          docker run --rm kairo-hermes:ci python -c "import importlib.metadata as m; assert m.version('hermes-agent') == '0.18.2'"
          docker run --rm kairo-hermes:ci python -c "from hermes_runtime.upstream import assert_zero_tool_profile; assert_zero_tool_profile()"
      - name: Verify certified migrations on clean PostgreSQL 18
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run preflight
      - run: npm run runtime:verify
      - run: npm run dashboard:build
      - uses: actions/upload-artifact@v4
        with:
          name: pes-dashboard
          path: dashboard/
          if-no-files-found: error

  semantic-benchmark:
    if: github.event_name == 'pull_request' && github.head_ref == 'kairo/vs-03'
    runs-on: ubuntu-latest
    services:
      semantic-postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_semantic
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
    env:
      SEMANTIC_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/kairo_semantic
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --no-audit --no-fund
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run VS-03 semantic benchmark
        shell: bash
        run: |
          set -o pipefail
          node scripts/semantic-benchmark.mjs | tee semantic-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs03-semantic-benchmark
          path: semantic-benchmark.log
          if-no-files-found: error
