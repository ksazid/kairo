name: VS-82 one-shot Instagram Reel publish
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  publish-reel:
    if: ${{ github.head_ref == 'smoke/vs73-instagram-reel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish owner-authorized KTM 390 Duke Reel
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
          KAIRO_RELEASE_SHA: d19c471a11ec30ca717870dc8ca4021ffac5fd5b
          KAIRO_SMOKE_TOKEN: ${{ secrets.KAIRO_SMOKE_TOKEN }}
          KAIRO_INSTAGRAM_REEL_URL: https://raw.githubusercontent.com/ksazid/kairo/0fabdf638441c89248c81c7c81eb35966fd4bc73/smoke-assets/ktm390duke-official-spec-reel.mp4
        run: node scripts/prod-instagram-reel.mjs
