name: One-shot reviewed lock refresh

on:
  push:
    branches: [fix/ci-lock-drift-npm-ci]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-lock-drift-npm-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate reviewed lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact reviewed dependency tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$actual" = "7cea0c6fd582c8c844e42d731ec116b732c26a81401b63517af4d9b0e8e112ce"
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            'node_modules/@neondatabase/auth': '0.5.0-beta',
            'node_modules/next': '16.3.1',
            'node_modules/better-auth': '1.6.23',
          };
          for (const [key, version] of Object.entries(expected)) {
            if (lock.packages?.[key]?.version !== version) {
              throw new Error(`${key} resolved ${lock.packages?.[key]?.version ?? 'missing'}, expected ${version}`);
            }
          }
          NODE
          printf '%s\n' "$actual" > deployment/dependency-lock.sha256
      - name: Commit reviewed lock only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json deployment/dependency-lock.sha256
          git diff --cached --quiet && exit 0
          git commit -m "chore: synchronize security dependency lockfile"
          git push origin HEAD:fix/ci-lock-drift-npm-ci
