name: TEMP Instagram backend smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke live Kairo API health and advertised version
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.KAIRO_API_URL;
          for (const [path, expectedStatus, expectedField, expectedValue] of [
            ['/health/live', 200, 'status', 'ok'],
            ['/health/ready', 200, 'status', 'ready'],
          ]) {
            const response = await fetch(`${base}${path}`);
            const body = await response.json();
            if (response.status !== expectedStatus || body?.[expectedField] !== expectedValue) {
              throw new Error(`${path} failed: ${response.status} ${JSON.stringify(body)}`);
            }
            console.log(`${path} PASS`);
          }
          const versionResponse = await fetch(`${base}/version`);
          const version = await versionResponse.json();
          if (versionResponse.status !== 200 || !/^[0-9a-f]{40}$/i.test(version?.releaseSha ?? '')) {
            throw new Error(`/version invalid: ${versionResponse.status} ${JSON.stringify(version)}`);
          }
          console.log(`advertised releaseSha=${version.releaseSha}`);
          NODE
      - name: Verify bodyless Instagram connect reaches auth boundary
        env:
          KAIRO_API_URL: https://kairo-api-kebs.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.KAIRO_API_URL;
          const response = await fetch(`${base}/api/v1/brands/backend-smoke/channels/instagram/connect`, { method: 'POST' });
          const text = await response.text();
          if (response.status === 400 && /FST_ERR_CTP_EMPTY_JSON_BODY|Body cannot be empty when content-type is set to 'application\/json'/i.test(text)) {
            throw new Error(`bodyless request still hit Fastify JSON parser failure: ${text}`);
          }
          if (response.status !== 401) {
            throw new Error(`expected authentication boundary 401, received ${response.status}: ${text}`);
          }
          console.log('bodyless Instagram connect reached authentication boundary without JSON parser failure');
          NODE
