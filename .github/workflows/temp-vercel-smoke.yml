name: TEMP REL-001 Vercel smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Kairo Vercel preview
        shell: bash
        env:
          KAIRO_WEB_URL: https://kairo-dbe3199vn-sazid62-gmailcoms-projects.vercel.app
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --dump-header /tmp/kairo-headers.txt --output /tmp/kairo-home.html --write-out '%{http_code}' "$KAIRO_WEB_URL/" || true)
          echo "status=$code"
          echo "content-type=$(grep -i '^content-type:' /tmp/kairo-headers.txt | tail -1 | tr -d '\r' || true)"
          echo "title=$(grep -o -i '<title>[^<]*' /tmp/kairo-home.html | head -1 | sed 's/<title>//I' || true)"
          echo "markers:"
          grep -Eo -i 'Authentication Required|Vercel|Kairo|404|not found|deployment' /tmp/kairo-home.html | sort -u | head -20 || true
          test "$code" = "200"
